<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
        #diagram { display: flex; justify-content: center; }
        #diagram svg { max-width: 100%; height: auto; }
        html.zoom, html.zoom body { overflow: visible; }
        html.zoom #diagram svg { position: absolute; }
        #error { font-family: monospace; font-size: 13px; white-space: pre-wrap; color: #d32f2f; padding: 8px; }
    </style>
    <script src="mermaid.min.js"></script>
</head>
<body>
<div id="diagram"></div>
<div id="error"></div>
<script>
    var zoomMode = false;

    function reportHeight() {
        var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
        EasyMarkdown.onHeight(h);
    }

    // Full screen mode: size the diagram to fit the screen; the WebView's own zoom handles pinch-to-zoom.
    function fitToScreen() {
        var svg = document.querySelector('#diagram svg');
        if (!svg || !svg.viewBox || !svg.viewBox.baseVal) return;
        var box = svg.viewBox.baseVal;
        var w = window.innerWidth - 16, h = window.innerHeight - 16;
        if (box.width <= 0 || box.height <= 0 || w <= 0 || h <= 0) return;
        var scale = Math.min(w / box.width, h / box.height);
        var width = box.width * scale, height = box.height * scale;
        // Positioned explicitly: percentage heights resolved to 0 in the full screen WebView.
        svg.style.maxWidth = 'none';
        svg.style.width = width + 'px';
        svg.style.height = height + 'px';
        svg.style.left = Math.max(8, (window.innerWidth - width) / 2) + 'px';
        svg.style.top = Math.max(8, (window.innerHeight - height) / 2) + 'px';
        document.body.style.height = window.innerHeight + 'px';
        window.scrollTo(0, 0);
        console.log('fit ' + Math.round(box.width) + 'x' + Math.round(box.height) +
            ' into ' + window.innerWidth + 'x' + window.innerHeight + ' scale ' + scale.toFixed(2));
    }

    async function render(code, dark, zoom) {
        zoomMode = zoom;
        if (zoom) {
            document.getElementById('viewport').setAttribute('content',
                'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=10, user-scalable=yes');
            document.documentElement.classList.add('zoom');
        }
        mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
        var target = document.getElementById('diagram');
        var error = document.getElementById('error');
        try {
            var result = await mermaid.render('mermaid-svg', code);
            target.innerHTML = result.svg;
            error.textContent = '';
        } catch (e) {
            target.innerHTML = '';
            error.textContent = 'Mermaid error:\n' + (e && e.message ? e.message : e);
            console.error('render failed: ' + e);
        }
        if (zoom) {
            console.log('rendered full screen, viewport ' + window.innerWidth + 'x' + window.innerHeight);
            fitToScreen();
        }
        requestAnimationFrame(reportHeight);
    }

    window.addEventListener('resize', function () {
        if (zoomMode) fitToScreen();
        reportHeight();
    });
</script>
</body>
</html>
