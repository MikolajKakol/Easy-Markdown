name: Android build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        if: hashFiles('composeApp/snapshots/*.png') == ''
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Unit & snapshot tests
        if: hashFiles('composeApp/snapshots/*.png') != ''
        run: ./gradlew :composeApp:verifyRoborazziDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: easy-markdown-debug-${{ github.run_number }}
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Rolling pre-release with a stable download link, so the APK can be installed straight from the phone.
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk easy-markdown-debug.apk
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug easy-markdown-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build (#${{ github.run_number }})" \
            --notes "Debug APK built from ${GITHUB_SHA::7} by run #${{ github.run_number }}."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            composeApp/build/reports/tests/
            composeApp/build/outputs/roborazzi/
